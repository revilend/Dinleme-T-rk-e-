# Render Blueprint (https://render.com/docs/blueprint-spec)
#
# Bu bot long-polling rejimida ishlaydi, lekin Render **Web Service** uchun
# $PORT da HTTP server talab qiladi — `bot.py` shu portda healthcheck ochadi
# (`/` va `/health` -> 200 OK) va uni polling bilan parallel ishlatadi.
#
# Ishga tushirish: Render Dashboard -> New + -> Blueprint -> shu reponi tanlang.
# BOT_TOKEN va ADMIN_IDS qiymatlari birinchi deplo'yda so'raladi (gitga tushmaydi).
services:
  - type: web
    name: turk-tili-a1-dinleme-bot
    runtime: python
    region: frankfurt
    plan: starter # doimiy disk uchun pullik compute kerak (bepul tarifda disk yo'q)
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    # Doimiy disk: SQLite baza (foydalanuvchilar + audio file_id lari) redeploy va
    # restartlarda saqlanib qoladi. DISKSIZ (bepul) xizmatda har deploy'da baza tozalanadi!
    disk:
      name: bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false # Render dashboardida kiritiladi (maxfiy)
      - key: ADMIN_IDS
        sync: false # masalan: 123456789
      - key: DB_PATH
        value: /var/data/bot.db # doimiy disk ichidagi bazani ishlatamiz
      # PORT ni Render o'zi beradi (masalan 10000) — qo'lda kiritish shart emas.
